name: n60-pro
description: Netcore N60 Pro optimized profile

target:
  platform: mediatek
  subtarget: filogic
  architecture: aarch64_cortex-a53

storage:
  data: /etc/magitrickle-mod
  cache: /etc/magitrickle-mod/cache
  temporary: /tmp/magitrickle-mod

mihomo:
  enabled: true
  controller: 127.0.0.1:9090

provider:
  default_profile: balanced
  update_interval: 6h

runtime:
  atomic_updates: true
  rollback: true
  cleanup_temp: true
